; macOS-specific engine overrides. Base config lives in DefaultEngine.ini.
;
; The shared DefaultEngine.ini relocates the Zen derived-data cache to
; V:/Born2FlapZen/Data (Windows). That path does not exist on macOS, so the
; local Zen server fails to launch and any unattended cook crashes with
; "Failed to delete oplog on the ZenServer". Point it at the external drive
; (plenty of free space; matches the original "off the system drive" intent).
[Zen.AutoLaunch]
DataPath=/Volumes/Ouranos/Born2FlapZen/Data
