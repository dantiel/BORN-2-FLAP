; ============================================================================
; BORN-2-FLAP — iOS platform overrides
; ============================================================================
; The desktop path in DefaultEngine.ini targets Metal SM5/SM6 with Substrate,
; Lumen, Virtual Shadow Maps, mesh distance fields and TSR. None of these run
; on the iOS mobile-forward renderer — they either fail to cook shaders or cost
; far too much on a phone GPU. This file keeps the desktop untouched and gives
; iOS a lean, mobile-forward configuration (iOS-first graphics reduction).
; ============================================================================

[/Script/Engine.RendererSettings]
; Substrate material model is desktop SM5+ only — mobile uses the legacy model.
r.Substrate=0
; No Lumen on mobile: dynamic global illumination + Lumen reflections off.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
; No virtual shadow maps / mesh distance fields on mobile.
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=0
; TSR (4) is desktop-only; fall back to temporal AA.
r.AntiAliasingMethod=2
; Mobile motion blur is a separate pass — disabled for the first iOS build.
r.DefaultFeature.MotionBlur=False

[ConsoleVariables]
; No cached-light pre-exposure on mobile (no Lumen/skylight cache).
r.EyeAdaptation.CachedLightingPreExposure=0
; Substrate rough-refraction blur is desktop-only — disabled on mobile.
r.Refraction.Blur=0
r.Refraction.OffsetQuality=0

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
; Placeholder bundle id — replace with the registered id from your Apple team.
BundleIdentifier=com.born2flap.Born2Flap
MinimumiOSVersion=15.0
