; The cook commandlet treats any LogPhysics "Error" as fatal. The
; FBodyInstance::GetSimplePhysicalMaterial error fired during native CDO
; construction is benign (the CDO is a template, never simulated at runtime).
; Suppress the channel below Fatal so this engine-level cook false-positive
; does not abort the unattended cook. Real physics simulation happens at
; runtime (Chaos), not during cook, so nothing of value is hidden here.
[Core.Log]
LogPhysics=Fatal

