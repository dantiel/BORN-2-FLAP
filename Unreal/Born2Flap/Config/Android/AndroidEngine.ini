; ============================================================================
; BORN-2-FLAP — Android platform overrides
; ============================================================================
; Mirrors the iOS mobile-forward reduction (see Config/IOS/IOSEngine.ini): the
; desktop path in DefaultEngine.ini targets SM5/SM6 with Substrate, Lumen,
; Virtual Shadow Maps, mesh distance fields and TSR. None of these run on the
; Android mobile renderer (Vulkan/GLES) — they either fail to cook shaders or
; cost far too much on a phone GPU. This file keeps the desktop untouched and
; gives Android a lean, mobile-forward configuration.
; ============================================================================

[/Script/Engine.RendererSettings]
; Substrate material model is desktop SM5+ only — mobile uses the legacy model.
r.Substrate=0
; No Lumen on mobile: dynamic global illumination + Lumen reflections off.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
; No virtual shadow maps / mesh distance fields on mobile.
r.Shadow.Virtual.Enable=0
r.GenerateMeshDistanceFields=0
; TSR (4) is desktop-only; fall back to temporal AA.
r.AntiAliasingMethod=2
; Mobile motion blur is a separate pass — disabled for the first Android build.
r.DefaultFeature.MotionBlur=False

[ConsoleVariables]
; No cached-light pre-exposure on mobile (no Lumen/skylight cache).
r.EyeAdaptation.CachedLightingPreExposure=0
; Substrate rough-refraction blur is desktop-only — disabled on mobile.
r.Refraction.Blur=0
r.Refraction.OffsetQuality=0
; Soft shadows on the mobile forward renderer (see IOSEngine.ini): two CSM
; cascades with a 2K shadow map (r.Shadow.MaxCSMResolution governs CSM).
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxCSMResolution=2048
r.Shadow.MaxResolution=2048
; Same Slate material-shader requirement as iOS: the game's UI uses
; UMaterialInstanceDynamic brushes (M_HammeredGlass, M_ScrollRetainerBlur, FPV
; fisheye), which need the "Dynamic" Slate material shader. In Static mode that
; shader is never compiled -> checkf("Unsupported Slate shader type ...") on the
; render thread -> frozen loading screen -> watchdog. Mode 2 = dynamic branches
; only (lowest shader count, always valid for material brushes).
slate.Mobile.MaterialShaderMode=2

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Registered bundle id for the darographix team (matches the iOS bundle id).
PackageName=com.darographix.Born2Flap
VersionDisplayName=1.0
StoreVersion=1
MinSDKVersion=23
TargetSDKVersion=36
; Flight sim: lock to landscape (both directions, auto-rotate).
Orientation=SensorLandscape
; Embed the cooked IoStore containers inside the APK instead of an .obb,
; matching the iOS embedded-content build (bUseZenStore=False in
; DefaultGame.ini). adb install handles a multi-hundred-MB APK fine.
bPackageDataInsideApk=True
; Modern phones are arm64; skip x86_64 to halve APK size and link time.
bBuildForArm64=True
bBuildForX8664=False
; Vulkan is the primary RHI on Android; keep OpenGL ES 3.1 as a fallback.
bSupportsVulkan=True
bBuildForES31=True