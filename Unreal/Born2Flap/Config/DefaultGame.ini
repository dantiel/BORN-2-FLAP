[/Script/UnrealEd.ProjectPackagingSettings]
bCookAll=True
bSkipEditorContent=True
bIncludeAppLocalPrerequisites=True
ApplocalPrerequisitesDirectory=(Path="$(EngineDir)/Binaries/ThirdParty/AppLocalDependencies")
; UE 5.8 defaults bUseZenStore=True, which stores cooked output in the Zen
; server and stages a STREAMING build (the .app carries ue.projectstore pointing
; at localhost:8558, no embedded content). A device cannot reach the host Zen
; server, so disable it: cook emits embedded .utoc/.ucas IoStore containers.
bUseZenStore=False

[/Script/Born2Flap.Born2FlapRadioSettings]
; Cover art is auto-detected from each track's folder/name, tried in order:
;   <Track>_Cover, Cover_<Track>, <Track>_Art  (e.g. /Game/Shiomori/Audio/SHIOMORI_BAY_I_Cover)
; To assign covers explicitly, add Covers=(...) index-aligned with Tracks= ("" = auto-detect).
+LevelRadios=(LevelName="Shiomori",StationName="SHIOMORI BAY / BEACH RADIO",Volume=0.5,CrossfadeSeconds=2.0,Tracks=("/Game/Shiomori/Audio/SHIOMORI_BAY_I","/Game/Shiomori/Audio/SHIOMORI_BAY_II"))
+LevelRadios=(LevelName="Ravenstonefield",StationName="RAVENSTONEFIELD / FIELD RADIO",Volume=0.38,CrossfadeSeconds=2.0,Tracks=("/Game/Ravenstonefield/Audio/TURBORAVEN"))