[/Script/UnrealEd.ProjectPackagingSettings]
bCookAll=False
bGenerateChunks=True
bUseIoStore=False
bSkipEditorContent=True
+MapsToCook=(FilePath="/Game/Shiomori/Maps/SHIOMORI")
; Only the worlds with an actual .umap are cookable. Ravenstonefield + NeonAbyss
; exist and were previously disabled for a Shiomori-only Android release —
; re-enable them so FLY works. Yunsha has only a DataAsset (no map yet) and
; Murex has no Content dir at all, so they must stay OUT of MapsToCook or the
; cook aborts (Error_UnknownCookFailure). Training uses /Engine/Maps/Entry.
+MapsToCook=(FilePath="/Game/NeonAbyss/Maps/NEONABYSS")
+MapsToCook=(FilePath="/Game/Ravenstonefield/Maps/RAVENSTONEFIELD")
; The mobile sky-sphere fallback (SkyAtmosphere is SM5-only) uses the engine's
; classic sky dome. ConstructorHelpers references in a CDO did not pull these
; into the iOS cook, so pin the directory explicitly.
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSky")
; The load-screen splash + menu background + logo are LoadObject'd at runtime
; (Born2Flap.cpp / Born2FlapMenu.cpp / Born2FlapHUD.cpp), so the cook never
; pulls them in by reference. Pin /Game/Splash so Android/iOS ship the same
; load-screen + background art as the PC build.
+DirectoriesToAlwaysCook=(Path="/Game/Splash")
; Avatar meshes/materials/animations are LoadObject'd by string at runtime
; (Born2FlapAvatar.cpp), so the cook never pulls them in by reference — the
; staged build ships WITHOUT any pilot (verified: 0 /Actor/ entries in the
; 18:57 pak). Pin the whole folder so packaged builds carry all 10 pilots.
+DirectoriesToAlwaysCook=(Path="/Game/Actor")
; Surf foam material, surf spray/mist Niagara, rain-splash + snow motes and
; the surf soundscape audio are all LoadObject'd by string at runtime
; (Born2FlapSurf.cpp / Born2FlapFlightPawn.cpp / Born2FlapSoundscape.cpp),
; so the cook never pulls them in by reference — the staged build shipped
; with NO breaking-surf material (black surf), no spray/mist, no wind motes
; and a silent surf bed (verified: only MPC_Weather in the 21:28 pak).
; Pin the whole folder so packaged builds carry the full weather set.
+DirectoriesToAlwaysCook=(Path="/Game/Weather")
; The semantic UI asset set (world-card art, slider/toggle/slider visuals, the
; scroll-blur + glass materials and the UI fonts) is LoadObject'd by string at
; runtime (Born2FlapUIRenderer), so the cook never pulls it in by reference —
; packaged builds shipped with NO card artwork, NO slider/toggle chrome and NO
; scroll-blur/transparency (verified: /Game/UI/Elements/* FAILED to load on iOS).
; Pin the whole folder so the Ruby Brain UI renders its full visual language.
+DirectoriesToAlwaysCook=(Path="/Game/UI")
bIncludeAppLocalPrerequisites=True
+DirectoriesToAlwaysStageAsNonUFS=(Path="ThirdParty")
ApplocalPrerequisitesDirectory=(Path="$(EngineDir)/Binaries/ThirdParty/AppLocalDependencies")
; UE 5.8 defaults bUseZenStore=True, which stores cooked output in the Zen
; server and stages a STREAMING build (the .app carries ue.projectstore pointing
; at localhost:8558, no embedded content). A device cannot reach the host Zen
; server, so disable it: cook emits embedded .utoc/.ucas IoStore containers.
bUseZenStore=False

[/Script/Born2Flap.Born2FlapRadioSettings]
