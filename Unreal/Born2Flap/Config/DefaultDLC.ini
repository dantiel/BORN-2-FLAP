; Born2Flap runtime DLC downloader configuration.
;
; The catalogue of downloadable worlds lives in Config/DLCManifest.json (served
; over HTTPS; see ManifestURL below). Each world is released individually (e.g.
; as a GitHub release asset) as a classic .pak file renamed to <World>.b2f-world,
; carrying that world's whole /Game/<World> directory, including its /Audio
; radio soundtrack. The manifest maps each world to its download URL, release
; version, byte size and sha1 checksum; the game re-downloads only when the local
; copy is missing or out of date. The chunk-id <-> world mapping also lives in
; Source/Born2Flap/DLC/Born2FlapDLCSubsystem.cpp and Tools/create_dlc_chunks.py.
;
; DLC paks are produced by Tools/build-android.ps1 (chunk 1..4 ->
; build-current/AndroidDLC/<World>.b2f-world) which also refreshes size/sha1 in
; DLCManifest.json after staging.
[/Script/Born2Flap.DLC]
; Absolute URL of the release manifest. Point it at the raw JSON in your
; worlds repo, e.g. https://raw.githubusercontent.com/<owner>/<repo>/main/Config/DLCManifest.json
ManifestURL=https://raw.githubusercontent.com/OWNER/born2flap-worlds/main/Config/DLCManifest.json

; Fallback base URL used only when a manifest entry has no download_url.
; e.g. https://cdn.example.com/born2flap/dlc/  (trailing slash optional)
BaseURL=https://cdn.example.com/born2flap/dlc/
