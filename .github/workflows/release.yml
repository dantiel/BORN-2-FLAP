name: Release packaging

# Builds and attaches distributable artifacts (macOS .dmg + Windows .zip/.exe) to a
# GitHub Release. Runs on self-hosted runners because Unreal Engine does not fit
# on the 14 GB disk of GitHub-hosted runners, and the Haskell native library
# must be compiled natively on each platform (no practical cross-compile).
#
# Runner labels (see docs/release-packaging.md):
#   macOS  -> [self-hosted, macOS, ARM64]  (the M1 Mac)
#   Windows -> [self-hosted, Windows, X64] (gamayun-win)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      platform:
        description: Platform to package
        type: choice
        options: [windows, macos, both]
        default: windows

permissions:
  contents: write

jobs:
readiness:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref_name }}
        lfs: true
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
    - name: Gate release readiness
      run: ruby Tools/generate-readiness.rb --check

  macos-dmg:
    if: github.event_name == 'push' || inputs.platform == 'macos' || inputs.platform == 'both'
    runs-on: [self-hosted, macOS, ARM64]
    needs: readiness
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          lfs: true
      - name: Package macOS .dmg
        run: bash Tools/package-mac.sh "$RELEASE_TAG"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          files: build/release/${{ env.RELEASE_TAG }}/*.dmg

  windows-exe:
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: [self-hosted, Windows, X64]
    needs: readiness
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          lfs: true
      - name: Package Windows build
        shell: powershell
        run: Tools/package-win.ps1 -Tag $env:RELEASE_TAG
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            build/release/${{ env.RELEASE_TAG }}/*.zip
            build/release/${{ env.RELEASE_TAG }}/*-extract.exe
            build/release/${{ env.RELEASE_TAG }}/*.sha256
